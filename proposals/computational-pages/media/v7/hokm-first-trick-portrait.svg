<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 850" role="img" aria-label="First saved trick: K spades, 9 spades, 2 spades, A spades; player 3 takes the trick">
<style>
  .micro{font:14px Consolas,monospace;letter-spacing:.5px;fill:#c7c4bc}
  .corner{font:700 27px Arial,sans-serif;fill:#20211f}
  .face{font:700 83px Arial,sans-serif;fill:#20211f}
  .tag{font:14px Consolas,monospace;fill:#514e48}
  .label{font:14px Consolas,monospace;letter-spacing:.3px;fill:#ddd8cd}
</style>
<rect width="580" height="850" fill="#151917"/>
<path d="M44 72H536M44 817H536" stroke="#565c55"/>
<text x="44" y="48" class="micro">SAVED SELF-PLAY / TRICK 01</text>
<text x="44" y="800" class="micro">TRUMP ♦ / P3 TAKES THE TRICK</text>
<g transform="translate(44 100)">
