      <line x1="16" y1="220" x2="204" y2="220" stroke="#c7c0b4"/>
      <text x="16" y="247" class="tag">P0 / TEAM 0</text>
      <text x="0" y="296" class="label">01 / LEAD</text>
    </g>
<g transform="translate(307 100)">
      <rect x="0" y="0" width="220" height="264" fill="#f4f0e7" stroke="#d6d0c5" stroke-width="2"/>
      <text x="16" y="34" class="corner">9♠</text>
      <text x="110.0" y="152.0" class="face" text-anchor="middle">9♠</text>
      <line x1="16" y1="220" x2="204" y2="220" stroke="#c7c0b4"/>
      <text x="16" y="247" class="tag">P1 / TEAM 1</text>
      <text x="0" y="296" class="label">02 / FOLLOW</text>
    </g>
<g transform="translate(44 458)">
      <rect x="0" y="0" width="220" height="264" fill="#f4f0e7" stroke="#d6d0c5" stroke-width="2"/>
      <text x="16" y="34" class="corner">2♠</text>
      <text x="110.0" y="152.0" class="face" text-anchor="middle">2♠</text>
      <line x1="16" y1="220" x2="204" y2="220" stroke="#c7c0b4"/>
      <text x="16" y="247" class="tag">P2 / TEAM 0</text>
      <text x="0" y="296" class="label">03 / FOLLOW</text>
    </g>
<g transform="translate(307 446)">
      <rect x="0" y="0" width="220" height="264" fill="#f4f0e7" stroke="#83a7d8" stroke-width="4"/>
      <text x="16" y="34" class="corner">A♠</text>
