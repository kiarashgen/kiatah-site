<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1480" role="img" aria-labelledby="title desc"><title id="title">Source-verified overview of the saved Dynamo graph</title><desc id="desc">Categories feed all elements. The first element type name, selected with code block 0, is compared against all type names to create a mask. The filtered in branch provides location curves, joined curves, a patched surface and its area. A separate out branch ends at a second GetLocation. No Revit output value is present.</desc><rect width="390" height="1480" fill="#eeeae2"/>
