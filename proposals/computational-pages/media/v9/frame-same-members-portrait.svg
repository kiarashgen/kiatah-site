<title id="title">The same two truss members across five declared structural cases</title>
<desc id="desc">A blue end diagonal and umber upper chord from the later 104-member frame are identified by the same Rhino curve IDs in five calculated cases. Changing only steel section mainly changes movement, while changing rise also changes their signed axial force. These results do not describe the group-built bridge test.</desc>
