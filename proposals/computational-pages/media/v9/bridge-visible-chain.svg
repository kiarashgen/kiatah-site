<title id="title">The five connections visible in the saved bridge Grasshopper screenshot</title>
<desc id="desc">The recorded crop shows Assemble Model to Analyse ThII to Model View to Beam View to a stress legend. A separate wire takes Mass in kilograms from Assemble Model to a yellow panel. Upstream inputs and the numerical case are outside the screenshot.</desc>
