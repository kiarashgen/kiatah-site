<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">X and O checkpoint decision structure</title><desc id="desc">The saved network encodes a board as nine X indicators and nine O indicators, passes them through hidden layers of 64 and 32 units, outputs nine cell scores, masks occupied cells, then applies one selected rule to choose a legal cell.</desc>
<rect width="1200" height="390" fill="#f1eee7"/>
<g font-family="IBM Plex Mono,monospace" font-size="15" fill="#294b8d"><text x="38" y="36">01 / BOARD STATE</text><text x="328" y="36">02 / ENCODE</text><text x="590" y="36">03 / SAVED NETWORK</text><text x="865" y="36">04 / SELECT MOVE</text></g>
<g stroke="#c4bdb2"><path d="M38 49H284M328 49H546M590 49H820M865 49H1162"/></g>
<g fill="#fff" stroke="#bfb9ae" stroke-width="2"><rect x="38" y="94" width="70" height="70"/><rect x="108" y="94" width="70" height="70"/><rect x="178" y="94" width="70" height="70"/><rect x="38" y="164" width="70" height="70"/><rect x="108" y="164" width="70" height="70"/><rect x="178" y="164" width="70" height="70"/><rect x="38" y="234" width="70" height="70"/><rect x="108" y="234" width="70" height="70"/><rect x="178" y="234" width="70" height="70"/></g>
<g font-family="Noto Sans Display,Arial,sans-serif" font-weight="700" font-size="43" fill="#242424"><text x="59" y="146">X</text><text x="130" y="217">X</text><text x="59" y="287">X</text></g><g font-family="Noto Sans Display,Arial,sans-serif" font-weight="700" font-size="43" fill="#294b8d"><text x="198" y="146">O</text><text x="198" y="217">O</text><text x="198" y="287">O</text></g>
<g font-family="IBM Plex Mono,monospace" font-size="16" fill="#242424"><text x="328" y="109">X  1 0 0 0 1 0 1 0 0</text><text x="328" y="150">O  0 0 1 0 0 1 0 0 1</text><text x="328" y="204" fill="#294b8d">18 binary inputs</text><text x="328" y="230" fill="#67635d">ordered cells 1–9</text></g>
<g fill="#294b8d"><circle cx="638" cy="129" r="23"/><circle cx="638" cy="205" r="23"/><circle cx="748" cy="166" r="23"/></g><g fill="#fff" font-family="IBM Plex Mono,monospace" font-size="15" text-anchor="middle"><text x="638" y="134">64</text><text x="638" y="210">64</text><text x="748" y="171">32</text></g><g fill="none" stroke="#849bc6" stroke-width="2"><path d="M661 129L725 166M661 205L725 166"/></g>
<g font-family="IBM Plex Mono,monospace" font-size="15" fill="#242424"><text x="865" y="100">9 raw scores</text><text x="865" y="142">occupied cells → mask</text><text x="865" y="184">remaining cells → rank</text><text x="865" y="226">policy: raw / win-block / exact</text></g><path d="M865 245H1138" stroke="#294b8d" stroke-width="3"/><text x="865" y="278" font-family="Noto Sans Display,Arial,sans-serif" font-size="26" font-weight="700" fill="#171715">One legal O move</text>
<g font-family="IBM Plex Mono,monospace" font-size="13" fill="#67635d"><text x="38" y="352">ILLUSTRATIVE BOARD / CHECKPOINT TOPOLOGY IS SAVED</text><text x="865" y="352">EXACT FILTER DOES NOT ALTER WEIGHTS</text></g>
</svg>
