<title id="title">Hokm decision two: the legal rule overrides a raw network preference</title>
<desc id="desc">The saved replay has a king of spades lead. Player one holds only a nine of spades. The raw network argmax is ace of diamonds, but follow-suit rules mask it. The legal nine of spades is played.</desc>
