<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 810" role="img" aria-labelledby="title description">
<title id="title">How the declared frame carries load</title>
<desc id="description">Case 02, one of two symmetric side planes. Nine 10 kN deck loads act on each plane. Upper chord members compress, the right end diagonal has the largest tension, and the deck moves downward a maximum of 2.48 mm at 18 m.</desc>
