<title id="title">Case 02 force and movement, narrow reading</title>
<desc id="description">A source-linked near side plane carries nine 10 kN deck loads. The upper chord compresses by 52.04 kN at highlighted member 7; the right end diagonal tensions by 42.35 kN at member 19. The deck moves down by up to 2.48 mm.</desc>
