<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 930" role="img" aria-labelledby="title description">
<title id="title">Five frame cases, narrow comparison</title>
<desc id="description">Movement and member mass are plotted with fixed scales for five separately declared structural cases under the same load.</desc>
