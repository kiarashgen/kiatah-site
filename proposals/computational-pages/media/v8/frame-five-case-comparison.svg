<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 575" role="img" aria-labelledby="title description">
<title id="title">Five declared bridge-frame cases at common scales</title>
<desc id="description">The first three hold the rise and change steel tube section. Cases 02, 04 and 05 hold section Ø160 by 6 and change rise. Every case has the same 180 kN load. Movement, mass and compression are shown on separate shared scales.</desc>
<rect width="1320" height="575" fill="#f5f1e9"/>
<text x="35.0" y="47.0" text-anchor="start" fill="#242320" font-family="Arial,sans-serif" font-size="24" font-weight="700">CHANGE ONE THING AT A TIME</text>
<text x="1280.0" y="47.0" text-anchor="end" fill="#315c96" font-family="monospace" font-size="14" font-weight="400">SAME 180 kN LOAD / FIVE DECLARED CASES</text>
<path d="M35.0,65.0 L1285.0,65.0" fill="none" stroke="#c7bfb3" stroke-width="1.00"/>
<text x="40.0" y="99.0" text-anchor="start" fill="#315c96" font-family="monospace" font-size="14" font-weight="400">FORM / SECTION</text>
<text x="515.0" y="99.0" text-anchor="start" fill="#315c96" font-family="monospace" font-size="14" font-weight="400">MAX MOVE · MM</text>
<text x="875.0" y="99.0" text-anchor="start" fill="#315c96" font-family="monospace" font-size="14" font-weight="400">MEMBER MASS · T</text>
<text x="1275.0" y="99.0" text-anchor="end" fill="#315c96" font-family="monospace" font-size="14" font-weight="400">PEAK COMPRESSION · kN</text>
<text x="40.0" y="138.0" text-anchor="start" fill="#315c96" font-family="monospace" font-size="12" font-weight="400">01 / SECTION</text>
<text x="40.0" y="166.0" text-anchor="start" fill="#242320" font-family="Arial,sans-serif" font-size="22" font-weight="700">Ø120 × 6</text>
<path d="M40.0,183.0 L1280.0,183.0" fill="none" stroke="#c7bfb3" stroke-width="1.00"/>
<path d="M515.0,162.0 L720.9,162.0" fill="none" stroke="#315c96" stroke-width="8.00"/>
<text x="760.0" y="168.0" text-anchor="end" fill="#242320" font-family="monospace" font-size="17" font-weight="700">3.35</text>
<path d="M875.0,162.0 L951.8,162.0" fill="none" stroke="#242320" stroke-width="8.00"/>
