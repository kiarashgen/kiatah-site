<text x="1275.0" y="484.0" text-anchor="end" fill="#aa6157" font-family="monospace" font-size="17" font-weight="700">−46.25</text>
<text x="40.0" y="556.0" text-anchor="start" fill="#625d55" font-family="monospace" font-size="13" font-weight="400">01–03: retained rise, changing section</text>
<text x="1280.0" y="556.0" text-anchor="end" fill="#625d55" font-family="monospace" font-size="13" font-weight="400">02, 04, 05: Ø160×6, changing rise</text>
