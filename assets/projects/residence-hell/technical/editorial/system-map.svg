<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc"><title id="title">Residence Hell system map</title><desc id="desc">Brief and parcel define a grid. Candidate validity and environmental evaluation inform placement. Checkpoints pass to circulation, plan synthesis and model output. Designer controls can intervene in a run.</desc><rect x="0" y="0" width="1440" height="500" fill="#141716"/><line x1="32" y1="37" x2="1408" y2="37" stroke="#727875" stroke-width="1"/><text x="32" y="27" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600">READING THE SYSTEM / SOURCE-BASED SCHEMA</text><text x="32" y="96" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">From a brief to a revisable building.</text><text x="32" y="127" fill="#b9bbb6" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">The saved run is a chain of states; a candidate replay exposes one decision inside it.</text><rect x="32" y="178" width="250" height="222" fill="#222725" stroke="#5e6863" stroke-width="1"/><rect x="32" y="178" width="250" height="4" fill="#8dacdb"/><text x="49" y="209" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">01 / BRIEF</text><text x="49" y="245" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Site · homes · policy</text><line x1="49" y1="260" x2="265" y2="260" stroke="#5e6863" stroke-width="1"/><text x="49" y="294" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Shahrak parcel</text><text x="49" y="324" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">100 households</text><text x="49" y="354" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">58 × 71 × 15 grid</text><rect x="316" y="178" width="250" height="222" fill="#222725" stroke="#5e6863" stroke-width="1"/><rect x="316" y="178" width="250" height="4" fill="#8dacdb"/><text x="333" y="209" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">02 / VALIDITY</text><text x="333" y="245" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Can this shape be here?</text><line x1="333" y1="260" x2="549" y2="260" stroke="#5e6863" stroke-width="1"/><text x="333" y="294" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Parcel + occupied cells</text><text x="333" y="324" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Access + support</text><text x="333" y="354" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">36 valid in replay</text><rect x="600" y="178" width="250" height="222" fill="#222725" stroke="#5e6863" stroke-width="1"/><rect x="600" y="178" width="250" height="4" fill="#8dacdb"/><text x="617" y="209" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">03 / EVALUATION</text><text x="617" y="245" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">How does it perform?</text><line x1="617" y1="260" x2="833" y2="260" stroke="#5e6863" stroke-width="1"/><text x="617" y="294" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Ten recorded fields</text><text x="617" y="324" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Room-role weights</text><text x="617" y="354" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Score + stack terms</text><rect x="884" y="178" width="250" height="222" fill="#222725" stroke="#5e6863" stroke-width="1"/><rect x="884" y="178" width="250" height="4" fill="#8dacdb"/><text x="901" y="209" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">04 / GROWTH</text><text x="901" y="245" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Save each decision</text><line x1="901" y1="260" x2="1117" y2="260" stroke="#5e6863" stroke-width="1"/><text x="901" y="294" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Place / repair / connect</text><text x="901" y="324" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">11-stage C01 programme</text><text x="901" y="354" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Checkpoints + branch</text><rect x="1168" y="178" width="240" height="222" fill="#222725" stroke="#5e6863" stroke-width="1"/><rect x="1168" y="178" width="240" height="4" fill="#8dacdb"/><text x="1185" y="209" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">05 / OUTPUT</text><text x="1185" y="245" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Draw the result</text><line x1="1185" y1="260" x2="1391" y2="260" stroke="#5e6863" stroke-width="1"/><text x="1185" y="294" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">100 / 100 placed</text><text x="1185" y="324" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Plan + fine model</text><text x="1185" y="354" fill="#c8cbc5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Site + export records</text><line x1="282" y1="288" x2="314" y2="288" stroke="#8dacdb" stroke-width="2"/><path d="M306 282 l8 6 -8 6" fill="none" stroke="#8dacdb" stroke-width="2"/><line x1="566" y1="288" x2="598" y2="288" stroke="#8dacdb" stroke-width="2"/><path d="M590 282 l8 6 -8 6" fill="none" stroke="#8dacdb" stroke-width="2"/><line x1="850" y1="288" x2="882" y2="288" stroke="#8dacdb" stroke-width="2"/><path d="M874 282 l8 6 -8 6" fill="none" stroke="#8dacdb" stroke-width="2"/><line x1="1134" y1="288" x2="1166" y2="288" stroke="#8dacdb" stroke-width="2"/><path d="M1158 282 l8 6 -8 6" fill="none" stroke="#8dacdb" stroke-width="2"/><line x1="32" y1="430" x2="1408" y2="430" stroke="#727875" stroke-width="1"/><text x="32" y="462" fill="#9bb7ed" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">DESIGNER CONTROL</text><text x="201" y="462" fill="#f1eee7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">set rules   /   inspect fields   /   lock or change cells   /   rewind and branch</text><text x="1408" y="487" fill="#959b95" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" text-anchor="end">C01 saved run + separate checkpoint replay / analytical redraw</text></svg>